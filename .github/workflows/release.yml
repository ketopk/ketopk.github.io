name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A2FC64: ${{ secrets.A2FC64 }}
          B2A065: ${{ secrets.B2A065 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A2FC64', '')
          k2 = os.environ.get('B2A065', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 727c6fa9abfbb05e55ff49 -->', k1) if k1 else txt
          out = out.replace('<!-- ed54c7059de42ff4064dc3ec2a652c66cfd6692b -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
